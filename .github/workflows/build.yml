name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Stockfish 11 for arm64
        run: |
          set -e
          git clone --depth 1 --branch sf_11 https://github.com/official-stockfish/Stockfish sf
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1); fi
          echo "NDK: $NDK"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$CXX" -O3 -std=c++11 -DNDEBUG -DIS_64BIT -DUSE_POPCNT -fPIE -pie -static-libstdc++ \
            sf/src/*.cpp sf/src/syzygy/tbprobe.cpp -o app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -la app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk duochess.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest duochess.apk \
            --title "DuoChess, сборка ${{ github.run_number }}" \
            --notes "Скачайте duochess.apk на телефон и установите." \
            --target "${{ github.sha }}"
